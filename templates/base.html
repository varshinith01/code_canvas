<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samvidhan AI - Constitutional Literacy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-stone-50 text-stone-900 flex flex-col min-h-screen font-sans">

    <nav class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{{ url_for('home') }}" class="flex items-center gap-2">
                        <span class="text-2xl">🇮🇳</span>
                        <span class="text-xl font-bold text-emerald-800 tracking-tight">Samvidhan AI</span>
                    </a>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="{{ url_for('home') }}" class="text-stone-600 hover:text-emerald-700 font-medium transition-colors">Home</a>
                    <a href="{{ url_for('chat') }}" class="text-stone-600 hover:text-emerald-700 font-medium transition-colors">Chat Guide</a>
                    <a href="{{ url_for('library') }}" class="text-stone-600 hover:text-emerald-700 font-medium transition-colors">Library</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-stone-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 text-center">
            <p class="text-stone-500 text-sm">
                Empowering Citizens. Privacy First. Built for India 🇮🇳
            </p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
